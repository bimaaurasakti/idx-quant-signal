name: Update Sinyal IDX Setelah Tutup Bursa

on:
  schedule:
    # 1. Sesi 1 (Senin - Kamis): Eksekusi 12:30 WIB (05:30 UTC)
    - cron: "30 5 * * 1-4"

    # 2. Sesi 1 (Jumat): Eksekusi 12:00 WIB (05:00 UTC)
    - cron: "0 5 * * 5"

    # 3. Sesi 2 (Senin - Jumat): Eksekusi 16:30 WIB (09:30 UTC)
    - cron: "30 9 * * 1-5"

  workflow_dispatch: {}   # Bisa dipicu manual dari tab "Actions" di GitHub

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan worker update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python worker_fetch_and_update.py