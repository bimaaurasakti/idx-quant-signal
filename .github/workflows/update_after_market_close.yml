name: Update Sinyal IDX Setelah Tutup Bursa

on:
  schedule:
    # Contoh: Ubah dari 05:30 ke 05:37 UTC (12:37 WIB)
    - cron: "37 5 * * 1-4"

    # Contoh: Ubah dari 05:00 ke 05:08 UTC (12:08 WIB)
    - cron: "8 5 * * 5"

    # Contoh: Ubah dari 09:30 ke 09:34 UTC (16:34 WIB)
    - cron: "34 9 * * 1-5"

  workflow_dispatch: {}   # Bisa dipicu manual dari tab "Actions" di GitHub

jobs:
  update-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan worker update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python worker_fetch_and_update.py