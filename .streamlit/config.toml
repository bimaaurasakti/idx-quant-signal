# Tema visual IDX Quant Signal Dashboard.
# Lihat IMPLEMENTATION_PLAN_UI_REDESIGN_STOCKBIT.md §4.1 untuk rationale
# tiap nilai (token warna lengkap ada di theme.py -- file ini HARUS tetap
# sinkron manual dengan theme.COLORS karena config.toml tidak bisa import
# Python).
#
# CATATAN: font di-load langsung dari Google Fonts lewat sintaks native
# Streamlit (bukan hack CSS @import). Kalau CDN font tidak terjangkau
# (mis. jaringan korporat/terbatas), Streamlit otomatis fallback ke font
# bawaan ("sans-serif"/"monospace") -- tidak perlu penanganan tambahan.

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#121826"
textColor = "#F1F5F9"
borderColor = "#232B3D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
baseFontWeight = 400
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0E131D"
